# 底盘控制逻辑闭环测试用控制器配置
# 由 chassis_driver(myrobot_controller)直接驱动四轮 effort 接口,
# 替代 diff_drive_controller —— 目的是在仿真里验证我们自己的麦轮解算 + PID。
#
# 用法: ros2 launch myrobot_gazebo gz_chassis_test.launch.py
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

# 关节顺序 [左前, 左后, 右前, 右后],chassis_driver 的 effort 指令按此顺序下发
wheel_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - left_front_wheel_joint
      - left_back_wheel_joint
      - right_front_wheel_joint
      - right_back_wheel_joint
